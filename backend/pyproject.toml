[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arakno-ai-backend"
version = "0.1.0"
description = "ARAKNO-AI Biomedical Research Platform Backend"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "ARAKNO-AI Team"}
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
